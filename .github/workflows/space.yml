# Keeps the Hugging Face Space (backend) on the latest main. Code only: the terrain rasters are
# git-ignored, so the first upload, and any data change, runs locally with `pixi run deploy-space`.
# Needs the repository variable HF_SPACE (<user>/<space>) and the secret HF_TOKEN (write access).
# See docs/deployment.md.
name: Deploy backend to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hf-space
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub
      - name: Upload code to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/deploy_space.py --code-only --space "${{ vars.HF_SPACE }}"
