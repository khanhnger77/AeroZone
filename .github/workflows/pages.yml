# Static frontend on GitHub Pages: https://<owner>.github.io/<repo>/
# The planner API, Copilot and 3D sim run on Google Cloud Run. Its address is built in below; the
# repository variable BACKEND_URL (Settings > Secrets and variables > Actions > Variables)
# overrides it. See docs/deployment.md.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [deploy/web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend
        env:
          # The Cloud Run backend (public address, not a secret). The repository variable
          # BACKEND_URL overrides it, e.g. after moving the backend.
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL || 'https://aerozone-215073679410.us-central1.run.app' }}
        run: npm run build -- --base "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
