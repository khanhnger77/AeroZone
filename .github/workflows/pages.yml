# Static frontend on GitHub Pages: https://<owner>.github.io/<repo>/
# The planner API, Copilot and 3D sim run on the Hugging Face Space named by the repository
# variable BACKEND_URL (Settings > Secrets and variables > Actions > Variables), e.g.
# https://<user>-<space>.hf.space. See docs/deployment.md.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the backend address
        if: ${{ vars.BACKEND_URL == '' }}
        run: echo "::warning::Repository variable BACKEND_URL is not set; routes, Copilot and the 3D sim will show offline."
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend
        env:
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: npm run build -- --base "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
