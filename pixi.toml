# MARS ODYSSEY: one environment for the web app, terrain pipeline and planner.
# pixi run demo: local web + planner. pixi run share: public Cloudflare URL.
[workspace]
name = "mars-odyssey"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
gdal = "*"
rasterio = "*"
numpy = "*"
scipy = "*"
scikit-image = "*"
geopandas = "*"
shapely = "*"
pyproj = "*"
pillow = "*"
requests = "*"
fastapi = "*"
uvicorn = "*"
httpx = "*"
pytest = "*"
nodejs = "20.*"
pybullet = "*"
aiohttp = "*"
pyyaml = "*"

[tasks]
demo = { cmd = "python scripts/share.py --local", description = "Build and serve the web app and planner locally" }
share = { cmd = "python scripts/share.py", description = "Share the current web app and planner through Cloudflare" }
backend = "uvicorn backend.main:app --port 8000 --reload --reload-dir backend"
frontend = { cmd = "npm install && npx vite --port 5173", cwd = "frontend" }
build = { cmd = "npm run build", cwd = "frontend" }
preview = { cmd = "npx vite preview --host 127.0.0.1 --port 4173 --strictPort", cwd = "frontend" }
data = "python scripts/download_data.py && python scripts/validate_data.py && python scripts/process_terrain.py && python scripts/generate_hazard.py && python scripts/render_layers.py && python scripts/build_science_targets.py"
test = "python -m pytest -q tests"

weather-data = { cmd = "python scripts/build_weather.py", description = "Download and summarize the MEDA historical weather snapshot" }
