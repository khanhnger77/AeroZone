# MARS ODYSSEY: one reproducible environment for the whole repo (contract C9).
#
# Quick start:
#   1. install pixi           https://pixi.sh  (curl -fsSL https://pixi.sh/install.sh | bash)
#   2. git clone <repo-url> Mars_Demo
#   3. cd Mars_Demo
#   4. pixi run demo          downloads data, builds the web app, starts everything on :4173
#
# Optional: `pixi run share` (public Cloudflare link), `pixi run data-env` (geology, climate,
# space weather; needs `pixi run data` first).

[workspace]
name = "mars-odyssey"
version = "1.1.0"
description = "MARS ODYSSEY: Jezero route planner, 3D rover simulation and NASA data pipeline"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
gdal = "*"
rasterio = "*"
numpy = "==2.4.6"     # pinned with pybullet/aiohttp: the sim's physics and transport (see check-env)
scipy = "*"
scikit-image = "*"
geopandas = "*"
shapely = "*"
pyproj = "*"
pillow = "*"
requests = "*"
fastapi = "*"
uvicorn = "*"
httpx = "*"
pytest = "*"
nodejs = "20.*"
pybullet = "==3.25"   # exact physics binary; every platform's build is pinned in pixi.lock
aiohttp = "==3.14.5"
pyyaml = "*"

[tasks]
demo = "python -m sim.tools.run_demo"
share = "python -m sim.tools.run_demo --share"
# Exits 1 unless every installed package is the exact file (version + build) pinned in pixi.lock.
check-env = "python -m sim.tools.check_env"
data = { depends-on = [
  "data-download",
  "data-validate",
  "data-process",
  "data-hazard",
  "data-render",
  "data-science",
] }
data-download = "python scripts/download_data.py"
data-validate = { cmd = "python scripts/validate_data.py", depends-on = ["data-download"] }
data-process = { cmd = "python scripts/process_terrain.py", depends-on = ["data-validate"] }
data-hazard = { cmd = "python scripts/generate_hazard.py", depends-on = ["data-process"] }
data-render = { cmd = "python scripts/render_layers.py", depends-on = ["data-hazard"] }
data-science = { cmd = "python scripts/build_science_targets.py", depends-on = ["data-render"] }
# [v1.1, PROPOSED C9-ext] environment & geology track; run `pixi run data` first.
data-env = { depends-on = [
  "env-download",
  "env-geology",
  "env-hazard",
  "env-render",
  "env-climate",
  "env-space-weather",
] }
env-download = "python scripts/download_env_data.py"
env-geology = { cmd = "python scripts/process_geology.py", depends-on = ["env-download"] }
env-hazard = { cmd = "python scripts/generate_hazard.py", depends-on = ["env-geology"] }
env-render = { cmd = "python scripts/render_layers.py", depends-on = ["env-hazard"] }
env-climate = { cmd = "python scripts/build_climate.py", depends-on = ["env-render"] }
env-space-weather = { cmd = "python scripts/fetch_space_weather.py", depends-on = ["env-climate"] }
backend = "uvicorn backend.main:app --port 8000 --reload --reload-dir backend"
sim = "python -m sim.server.sim_server"
frontend = { cmd = "npm install && npx vite --port 5173", cwd = "frontend" }
fetch-assets = "python -m sim.tools.fetch_assets"
test = "python -m pytest -q sim/tests sim/obstacle_avoid/tests tests odyssey_copilot/backend/test_copilot.py"
# M3: web-only build/preview and the historical MEDA weather snapshot (Weather tab).
build = { cmd = "npm run build", cwd = "frontend" }
preview = { cmd = "npx vite preview --host 127.0.0.1 --port 4173 --strictPort", cwd = "frontend" }
weather-data = { cmd = "python scripts/build_weather.py", description = "Download and summarize the MEDA historical weather snapshot" }
# Online demo: build and deploy the backend (code + terrain rasters) to Google Cloud Run; see
# docs/deployment.md. Needs the Google Cloud CLI (gcloud) on PATH; pixi.lock is untouched.
deploy-cloudrun = { cmd = "python scripts/deploy_cloudrun.py", description = "Deploy the backend to Google Cloud Run (--project <id>)" }
