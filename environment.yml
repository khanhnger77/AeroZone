# Alternative to pixi (pixi.toml is the reference environment, contract C9).
#   conda env create -f environment.yml && conda activate mars
name: mars
channels:
  - conda-forge
dependencies:
  - python=3.11
  - gdal
  - rasterio
  - numpy
  - scipy
  - scikit-image
  - geopandas
  - shapely
  - pyproj
  - pillow
  - requests
  - fastapi
  - uvicorn
  - httpx
  - pytest
  - nodejs=20
  - pybullet
  - aiohttp
  - pyyaml
