source: https://pds-atmospheres.nmsu.edu/data_and_services/atmospheres_data/PERSEVERANCE/meda.html
base_url: https://atmos.nmsu.edu/PDS/data/PDS4/Mars2020/mars2020_meda/
document: https://atmos.nmsu.edu/PDS/data/PDS4/Mars2020/mars2020_meda/document/meda_env_rdr_sis.pdf
